# Local stack: PostgreSQL + ParkShare API.
#   cp .env.example .env   # then set PARKSHARE_JWT_SECRET and passwords
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parkshare
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-parkshare}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
    volumes:
      - parkshare-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d parkshare"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parkshare
    ports:
      - "8080:8080"

volumes:
  parkshare-db:
