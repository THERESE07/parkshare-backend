# Render Blueprint: creates the ParkShare API with all settings.
# Render dashboard -> New -> Blueprint -> pick this repo.
# You will be asked only for the values marked "sync: false".
services:
  - type: web
    name: parkshare-api
    runtime: docker
    # Starter (0.5 CPU, no sleeping) starts in under 3 minutes.
    # The free plan (0.1 CPU) takes ~15 minutes to start and sleeps when idle: not usable.
    plan: starter
    # Closest Render region to Rwanda; create the Neon database in Frankfurt too.
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # --- Database (Neon: use the DIRECT connection, not the "-pooler" one) ---
      - key: SPRING_DATASOURCE_URL
        sync: false   # jdbc:postgresql://ep-xxxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Small pool; let idle connections close so Neon can sleep and stay in its free hours.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUMIDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLETIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVETIME
        value: "0"
      # Housekeeping every 15 min instead of every minute (keeps Neon within free compute hours).
      - key: PARKSHARE_SCHEDULER_INTERVAL_MS
        value: "900000"

      # --- Secrets (generated by Render, never typed by hand) ---
      - key: PARKSHARE_JWT_SECRET
        generateValue: true
      - key: PARKSHARE_PAYMENTS_WEBHOOKSECRET
        generateValue: true

      # --- First admin account ---
      - key: PARKSHARE_SECURITY_ADMINEMAIL
        sync: false
      - key: PARKSHARE_SECURITY_ADMINPASSWORD
        sync: false   # 12+ characters
      # Frontend address(es), comma-separated, e.g. https://parkshare-web.vercel.app
      - key: PARKSHARE_SECURITY_ALLOWEDORIGINS
        sync: false

      # --- Trial mode: no real money, messages written to the log ---
      - key: PARKSHARE_PAYMENTS_PROVIDER
        value: sandbox
      - key: PARKSHARE_PAYMENTS_SANDBOXENDPOINTSENABLED
        value: "true"
      - key: PARKSHARE_MESSAGING_SMSPROVIDER
        value: log
      - key: PARKSHARE_MESSAGING_EMAILPROVIDER
        value: log
